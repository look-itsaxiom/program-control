# gqlgen configuration. Paths below are relative to api/ (run gqlgen from there; see README.md
# in this folder for the exact command, since this config does not live at the module root).
schema:
  - internal/graph/schema.graphqls

exec:
  filename: internal/graph/generated/generated.go
  package: generated

model:
  filename: internal/graph/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: internal/graph
  package: graph

# The Program, Task, and User structs are hand-written in internal/graph/model/models.go. Binding
# them here rather than letting gqlgen generate them is what makes the loaders possible: a field
# the struct does not carry (Program.tasks, Task.predecessors) becomes a resolver gqlgen calls on
# demand, instead of a struct field every query would have to fill eagerly.
models:
  Program:
    model: github.com/look-itsaxiom/program-control/api/internal/graph/model.Program
  Task:
    model: github.com/look-itsaxiom/program-control/api/internal/graph/model.Task
  User:
    model: github.com/look-itsaxiom/program-control/api/internal/graph/model.User
